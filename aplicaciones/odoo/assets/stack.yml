# version: "3.8"
services:
  db:
    image: postgres:17
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password
    networks:
      - odoo-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first

  odoo:
    image: odoo-enterprise:19.0
    environment:
      HOST: db
      USER: odoo
      PASSWORD_FILE: /run/secrets/postgresql_password
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - type: bind
        source: /opt/odoo19-docker/config
        target: /etc/odoo
      - type: bind
        source: /opt/odoo19-docker/addons
        target: /mnt/extra-addons
      - type: bind
        source: /opt/odoo19-docker/logs
        target: /var/log/odoo
    secrets:
      - postgresql_password
    networks:
      - odoo-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  odoo-net:
    driver: overlay

volumes:
  odoo-web-data:
  odoo-db-data:

secrets:
  postgresql_password:
    external: true